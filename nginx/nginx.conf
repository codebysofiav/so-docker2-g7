# Archivo de configuracion de Nginx como proxy inverso.
# Se monta en /etc/nginx/conf.d/default.conf dentro del contenedor,
# por eso solo contiene el bloque "server" (sin "http" ni "events").

server {
    listen 80;
    # Puerto en el que escucha Nginx DENTRO del contenedor.
    # En docker-compose.yml se publica como 8080:80, o sea, el host usa el 8080.

    server_name _;
    # Nombre de servidor generico: acepta cualquier host (localhost, IP, etc.).

    # ---------- RUTA 0: comprobacion de salud ----------
    location /salud {
        default_type text/plain;
        return 200 'ok';
        # Nginx responde por si mismo, sin consultar a la aplicacion.
    }

    # ---------- RUTA 1: proxy inverso hacia Node.js bajo /api/ ----------
    location /api/ {
        # Toda peticion que empiece por /api/ se reenvia a la aplicacion.
        proxy_pass http://app:3000/;
        # "app" es el nombre del servicio en docker-compose (DNS interno).
        # La "/" final hace que Nginx quite el prefijo /api:
        #   /api/visitas  ->  http://app:3000/visitas

        proxy_set_header Host $host;
        # Conserva el nombre de host original que pidio el cliente.

        proxy_set_header X-Real-IP $remote_addr;
        # Pasa a la app la IP real del cliente.
    }

    # ---------- RUTA 2: contenido estatico bajo /estatico/ ----------
    location /estatico/ {
        alias /usr/share/nginx/html/;
        # Carpeta dentro del contenedor donde estan los archivos estaticos
        # (se enlaza con ./nginx/html del host mediante un volumen).

        index index.html;
        # Archivo que se muestra cuando se pide "/estatico/".
    }

    # ---------- RUTA 3: todo lo demas va a la aplicacion ----------
    location / {
        proxy_pass http://app:3000;
        # Mantiene el comportamiento del proyecto: / responde la app.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}