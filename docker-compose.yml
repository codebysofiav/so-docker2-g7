services:
  app:
    build: ./app              # construye con el Dockerfile
    env_file: .env            # variables de entorno
    expose: ["3000"]          # sin puerto fijo: permite escalar
    volumes: ["datos:/data"]  # volumen persistente
    depends_on: [redis]
    networks: [red-so]
  redis:
    image: redis:7-alpine     # servicio de apoyo
    volumes: ["redis-data:/data"]
    networks: [red-so]
  nginx:
    image: nginx:alpine       # proxy inverso
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on: [app]
    networks: [red-so]
volumes:
  datos:
  redis-data:
networks:
  red-so:
